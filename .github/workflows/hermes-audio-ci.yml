name: Hermes Audio CI

on:
  push:
    paths:
      - "src/evez_machine_voice/hermes_audio/**"
      - "tests/test_hermes_audio.py"
      - "tests/test_scene_director.py"
      - "tests/test_score_compiler.py"
      - "tests/test_conductor.py"
      - "tests/test_album.py"
      - "tests/test_audio_jobs.py"
      - "config/hermes-*.yaml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/evez_machine_voice/hermes_audio/**"
      - "tests/test_hermes_audio.py"
      - "config/hermes-*.yaml"
      - "pyproject.toml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hermes,audio,dev]"

      - name: Unit tests
        run: pytest -q

      - name: Hermes control-plane tests
        run: pytest -q tests/test_scene_director.py tests/test_score_compiler.py tests/test_conductor.py tests/test_album.py tests/test_audio_jobs.py

      - name: Compile Python
        run: python -m compileall -q src/evez_machine_voice

      - name: Secret scan
        run: |
          if grep -RniE '(OPENAI_API_KEY|SUPABASE_SERVICE_ROLE_KEY|HF_TOKEN|ACESTEP_API_KEY|BEGIN PRIVATE KEY)' \
              src config scripts . \
              --exclude-dir=.git \
              --exclude='*.md' \
              --exclude='hermes-audio-ci.yml'; then
            echo "Potential secret material found."
            exit 1
          fi
