[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evez-machine-voice"
version = "1.1.0"
description = "EVEZ machine voice plus local Hermes cinematic audio sidecar"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Steven Crawford-Maggard", email = "steven@evez-os.ai"},
]
keywords = ["voice", "synthesis", "tts", "cinematic", "music", "hermes", "evez"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
]

[project.optional-dependencies]
hermes = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
]
audio = [
    "librosa>=0.10,<1",
]
dev = ["pytest>=7.0", "pytest-asyncio", "ruff"]

[project.urls]
Homepage = "https://evez-os.ai"
Repository = "https://github.com/EvezArt/evez-machine-voice"

[project.scripts]
evez-voice = "evez_machine_voice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
